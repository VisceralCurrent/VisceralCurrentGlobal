<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visceral Current | The Visceral Oracle</title>
    
    <meta name="theme-color" content="#050a0f">
    
    <!-- Fonts & Icons -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Global Styles & Glassmorphism -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS (Ecosystem Standard) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'visceral-gold': '#00e5ff', 'visceral-dark': '#050a0f', 'visceral-scarlett': '#e11d48', visceral: { gold: '#00e5ff', dark: '#050a0f', scarlett: '#e11d48', card: 'rgba(15, 17, 21, 0.65)' } }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], cinzel: ['Cinzel', 'serif'], mono: ['Space Mono', 'monospace'] }, animation: { 'slow-spin': 'spin 20s linear infinite', 'float': 'float 6s ease-in-out infinite', 'pulse-glow': 'pulseGlow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite' }, keyframes: { float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } }, pulseGlow: { '0%, 100%': { opacity: 0.4, transform: 'scale(1)' }, '50%': { opacity: 0.8, transform: 'scale(1.05)' } } } } } }
    </script>
</head>
<body class="antialiased bg-[#050a0f] text-slate-200 m-0 p-0 overflow-x-hidden min-h-screen w-screen">

    <!-- Custom Cursor Setup -->
    <div id="custom-cursor-dot" class="fixed top-0 left-0 w-2 h-2 bg-visceral-gold rounded-full pointer-events-none z-[9999] mix-blend-screen shadow-[0_0_10px_rgba(0,229,255,0.8)]"></div>
    <div id="custom-cursor-ring" class="fixed top-0 left-0 w-8 h-8 border border-visceral-gold/50 rounded-full pointer-events-none z-[9998] transition-colors duration-300"></div>

    <!-- Navigation Anchor -->
    <nav class="w-full relative z-50 py-6 px-6 md:px-12 pointer-events-none">
        <a href="index.html" class="inline-flex items-center gap-3 text-slate-500 hover:text-white transition-colors group pointer-events-auto">
            <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
            <span class="font-mono text-[10px] uppercase tracking-widest">Return to Matrix</span>
        </a>
    </nav>

    <!-- React App Mount Point -->
    <div id="root-oracle"></div>

    <!-- Global Script Execution (Cursor) -->
    <script src="script.js"></script>
    
    <!-- Vite Entry Point -->
    <script type="module" src="./main-oracle.jsx"></script>
</body>
</html>
