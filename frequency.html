<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visceral Current | Discovering Essence</title>
    <meta name="theme-color" content="#050a0f">

    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Restored for Absolute Stability) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'visceral-gold': '#00e5ff', 'visceral-dark': '#050a0f', 'visceral-scarlett': '#e11d48', visceral: { gold: '#00e5ff', dark: '#050a0f', scarlett: '#e11d48', card: 'rgba(15, 17, 21, 0.65)' } }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], cinzel: ['Cinzel', 'serif'] }, animation: { 'slow-spin': 'spin 20s linear infinite', 'float': 'float 6s ease-in-out infinite', 'pulse-glow': 'pulseGlow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite' }, keyframes: { float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } }, pulseGlow: { '0%, 100%': { opacity: 0.4, transform: 'scale(1)' }, '50%': { opacity: 0.8, transform: 'scale(1.05)' } } } } } }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-[#050a0f] text-white selection:bg-visceral-scarlett/30 selection:text-white overflow-hidden h-screen w-screen">

    <!-- Ambient Background Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute w-[800px] h-[800px] rounded-full top-[-20%] right-[-10%] glow-entity" style="background: radial-gradient(circle, rgba(100,116,139,0.1) 0%, transparent 70%);"></div>
        <div class="absolute w-[600px] h-[600px] rounded-full bottom-[-10%] left-[-10%] glow-entity" style="background: radial-gradient(circle, rgba(225,29,72,0.1) 0%, transparent 70%);"></div>
    </div>

    <!-- Custom Cursor Setup -->
    <div id="custom-cursor-dot" class="fixed top-0 left-0 w-2 h-2 bg-visceral-scarlett rounded-full pointer-events-none z-[9999] mix-blend-screen shadow-[0_0_10px_rgba(225,29,72,0.8)]"></div>
    <div id="custom-cursor-ring" class="fixed top-0 left-0 w-8 h-8 border border-visceral-scarlett/50 rounded-full pointer-events-none z-[9998] transition-colors duration-300"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 py-6 px-6 md:px-12 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-4 group cursor-pointer z-50">
            <div class="w-8 h-8 border border-white/30 rounded-sm flex items-center justify-center rotate-45 group-hover:border-visceral-scarlett transition-colors">
                <span class="text-white font-bold -rotate-45 text-xs group-hover:text-visceral-scarlett">VC</span>
            </div>
            <span class="font-cinzel text-lg tracking-[0.2em] font-bold text-white uppercase group-hover:text-visceral-scarlett transition-colors hidden md:block">Visceral Current</span>
        </a>
        <div class="text-[10px] uppercase tracking-[0.3em] text-gray-500 font-mono z-50 flex items-center gap-2">
            <div class="w-1.5 h-1.5 rounded-full bg-visceral-scarlett animate-pulse"></div> Discovering Essence
        </div>
    </nav>

    <!-- Assessment Container -->
    <main class="relative z-10 h-full flex flex-col items-center justify-center px-6">
        <div id="assessment-card" class="glass-panel w-full max-w-3xl rounded-3xl p-8 md:p-14 border-t-2 border-t-visceral-scarlett/50 shadow-[0_0_50px_rgba(225,29,72,0.1)] transition-all duration-700 transform">
            
            <!-- Progress Bar -->
            <div id="progress-container" class="w-full h-1 bg-white/10 rounded-full mb-12 overflow-hidden hidden">
                <div id="progress-bar" class="h-full bg-visceral-scarlett w-0 transition-all duration-500"></div>
            </div>

            <!-- Content Area -->
            <div id="content-area" class="text-center min-h-[300px] flex flex-col justify-center transition-opacity duration-500">
                <!-- Initial Hook -->
                <span class="text-visceral-scarlett font-mono text-xs tracking-[0.3em] uppercase block mb-4">Phase I: The Map</span>
                <h1 class="text-3xl md:text-5xl font-cinzel font-bold text-white mb-6">Discovering Essence</h1>
                <p class="text-gray-400 font-light leading-relaxed mb-10 max-w-lg mx-auto">To scale your capacity to absolute infinity, we must first map your core essence. This 12-stage matrix compresses time into efficient discovery, synthesizing raw data into foundational understanding.</p>
                
                <button onclick="startAssessment()" class="btn-gold mx-auto px-10 py-4 bg-white text-black rounded-sm hover:bg-visceral-scarlett hover:text-white transition duration-300 font-bold uppercase tracking-[0.2em] text-xs shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                    Initiate Scan
                </button>
            </div>

        </div>
    </main>

    <script>
        const questions = [
            {
                theme: "The Mechanics of Action",
                q: "When confronted with an immovable obstacle or systemic failure, what is your immediate kinetic reaction?",
                options: [
                    { text: "Strike harder. Force compliance to regain control.", score: 100 },
                    { text: "Analyze and sidestep. Find the path of least resistance.", score: 300 },
                    { text: "Absorb its kinetic energy. Use its mass to accelerate my trajectory.", score: 528 }
                ],
                insight: {
                    anchor: "Force generates counter-force. Striking the wall only damages the fist and depletes your finite reserves.",
                    ascent: "Analysis avoids damage, but merely bypassing the obstacle leaves its massive potential energy untapped.",
                    balance: "The Visceral Current absorbs the friction (ϕ). You do not fight the system; you mathematically consume its momentum."
                }
            },
            {
                theme: "The Architecture of Identity",
                q: "When stripped of your title, net worth, and past achievements, what remains of your architecture?",
                options: [
                    { text: "Vulnerability. A frantic need to rebuild status immediately.", score: 100 },
                    { text: "A blank slate. The logical freedom to rewrite the narrative.", score: 300 },
                    { text: "The Zero Point. The absolute, indestructible source code of my existence.", score: 528 }
                ],
                insight: {
                    anchor: "Ego attaches to external fiat metrics. When the market collapses, the identity shatters with it.",
                    ascent: "Logic recognizes the temporary nature of titles, offering a stoic, detached peace.",
                    balance: "Sovereignty realizes that the Zero Point (o) is immortal. You are the Architect, not the building."
                }
            },
            {
                theme: "The Geometry of Conflict",
                q: "How do you respond to direct betrayal or a coordinated systemic attack?",
                options: [
                    { text: "Vengeance. I destroy the threat to protect my perimeter.", score: 100 },
                    { text: "Detachment. I sever the connection and logically optimize my losses.", score: 300 },
                    { text: "Transmutation. I identify the systemic flaw they exposed and integrate it as armor.", score: 528 }
                ],
                insight: {
                    anchor: "Vengeance is an emotional tax paid to your enemies. It permanently drains your kinetic reserve.",
                    ascent: "Severing ties stops the bleeding efficiently, but leaves the underlying systemic vulnerability unresolved.",
                    balance: "Transmutation turns the attack into a free audit. You thank the enemy for exposing the flaw, then fortify the matrix."
                }
            },
            {
                theme: "The Calculus of Time",
                q: "How do you quantify the 'lost years', detours, or massive failures of your past?",
                options: [
                    { text: "As a deficit. A permanent scar that puts me perpetually behind schedule.", score: 100 },
                    { text: "As education. Expensive lessons that logically prevent future mistakes.", score: 300 },
                    { text: "As mathematical necessity. The exact Phase Shift required to reach my current frequency.", score: 528 }
                ],
                insight: {
                    anchor: "Regret is a low-frequency anchor. It forces you to continually pay psychological interest on a dead debt.",
                    ascent: "Extracting lessons is efficient, but still views the event fundamentally as a 'mistake' to be managed.",
                    balance: "Mathematical certainty dictates that every detour was the exact Phase Shift required to place you at this highly leveraged coordinate."
                }
            },
            {
                theme: "The Flow of Capital",
                q: "What is the true mathematical purpose of accumulating massive wealth?",
                options: [
                    { text: "Security. Shielding myself from the volatility and danger of the world.", score: 100 },
                    { text: "Freedom. The logical ability to buy back my time and autonomy.", score: 300 },
                    { text: "Kinetic Leverage. Funding the architecture to scale my Area of Impact to infinity.", score: 528 }
                ],
                insight: {
                    anchor: "Hoarding resources out of fear signals to the universe that your default state is scarcity.",
                    ascent: "Buying freedom is noble, but isolates you from the greater systemic flow of the collective.",
                    balance: "Capital is simply stored kinetic energy. You accumulate it to deploy massive, infinite-scaling architecture for your tribe."
                }
            },
            {
                theme: "The Synergetic Network",
                q: "On what fundamental basis do you select the nodes of your inner circle?",
                options: [
                    { text: "Utility. What they can actively do to advance my current position.", score: 100 },
                    { text: "Competence. Their verifiable skills, intellect, and reliability.", score: 300 },
                    { text: "Resonance. A synergetic frequency that mathematically balances my Phase Shift.", score: 528 }
                ],
                insight: {
                    anchor: "Transactional relationships create brittle, highly volatile networks that instantly collapse under pressure.",
                    ascent: "Competence builds highly functional teams, but logic alone cannot survive a true systemic crisis.",
                    balance: "Synergy (C) multiplies force. A resonant tribe operates as a single organism, moving with unspoken, telepathic precision."
                }
            },
            {
                theme: "The Locus of Focus",
                q: "Where does your conscious processing power predominantly reside?",
                options: [
                    { text: "The Past. Ruminating on trauma, old victories, or what could have been.", score: 100 },
                    { text: "The Future. Strategizing, worrying, and constantly preparing for probability.", score: 300 },
                    { text: "The Eternal Now. Converting present potential into undeniable kinetic reality.", score: 528 }
                ],
                insight: {
                    anchor: "Living in the past guarantees its repetition. You are dedicating RAM to downloading dead data.",
                    ascent: "Living in the future creates perpetual anxiety. You are suffering for events that do not yet exist.",
                    balance: "The Eternal Now is the only dimension where Area of Impact (A) can be generated. Execution happens in the present millisecond."
                }
            },
            {
                theme: "The Void of the Unknown",
                q: "When stepping into a completely alien paradigm or industry, what is your primary state?",
                options: [
                    { text: "Anxiety. A desperate scramble to establish control and familiarity.", score: 100 },
                    { text: "Calculation. A methodical mapping of rules before taking calculated risks.", score: 300 },
                    { text: "Awe. I am the observer, watching the universal math reveal its new geometry.", score: 528 }
                ],
                insight: {
                    anchor: "Anxiety constricts the wave function. It forces you to operate at a biologically taxing survival frequency.",
                    ascent: "Calculation mitigates risk, but over-analysis paralyzes the visceral instinct required for genius.",
                    balance: "Awe expands capacity. When you observe the unknown with curiosity, you naturally align with the universe's expansive geometry."
                }
            },
            {
                theme: "The Destruction of Illusion",
                q: "How do you react when a foundational, long-held belief of yours is proven mathematically false?",
                options: [
                    { text: "Defensiveness. I double down to protect my established identity.", score: 100 },
                    { text: "Recalibration. I update my internal models to reflect the new data.", score: 300 },
                    { text: "Liberation. I celebrate the destruction of a limitation. The ceiling was fake.", score: 528 }
                ],
                insight: {
                    anchor: "Defending a dead paradigm is the ultimate waste of biological energy. It is intellectual suicide.",
                    ascent: "Recalibration is incredibly healthy, updating the software without challenging the hardware.",
                    balance: "Liberation occurs when you realize every shattered belief simply expands the perimeter of your empire. The ceiling was always an illusion."
                }
            },
            {
                theme: "The Absolute Sovereign",
                q: "What is the ultimate, undeniable expression of executive power?",
                options: [
                    { text: "Dominance. The ability to make the environment and others obey my will.", score: 100 },
                    { text: "Autonomy. Complete independence from the demands and control of the system.", score: 300 },
                    { text: "Sovereignty. Generating a gravity well so massive that the environment naturally bends to me.", score: 528 }
                ],
                insight: {
                    anchor: "Dominance requires constant, exhausting enforcement. The dictator never sleeps.",
                    ascent: "Autonomy is peaceful, but true isolation prevents you from lifting others with your gravity.",
                    balance: "Sovereignty is effortless. By mastering your internal architecture, the external world aligns to you mathematically. You become the sun."
                }
            },
            {
                theme: "The Structure of Chaos",
                q: "How do you structure your daily operational flow amidst high volatility?",
                options: [
                    { text: "Reaction. Putting out fires and responding to the loudest external demands.", score: 100 },
                    { text: "Regimentation. Strict, unyielding discipline that breaks down when interrupted.", score: 300 },
                    { text: "Dynamic Equilibrium. A fluid architecture that absorbs chaos and remains centered.", score: 528 }
                ],
                insight: {
                    anchor: "Reaction makes you a slave to the environment. You are a leaf caught in the hurricane.",
                    ascent: "Rigid regimentation shatters when the Black Swan event arrives. It is too brittle to survive.",
                    balance: "Dynamic Equilibrium bends but never breaks. You absorb the chaos, run it through your framework, and output pure order."
                }
            },
            {
                theme: "The Infinite Horizon",
                q: "How do you view the eventual conclusion of your biological timeline?",
                options: [
                    { text: "With dread. A final deadline that makes all acquisition feel urgent and terrifying.", score: 100 },
                    { text: "With stoicism. A natural biological conclusion that necessitates leaving a good name.", score: 300 },
                    { text: "As a variable. My physical vessel ends, but the Infinite Sum (S) I architected echoes eternally.", score: 528 }
                ],
                insight: {
                    anchor: "Dread limits your vision to a single biological lifespan, making true empire-building mathematically impossible.",
                    ascent: "Stoicism accepts the end gracefully, but often fails to leverage the life for maximum generational velocity.",
                    balance: "The Infinite Sum (S) outlives the flesh. You architect a system of value so undeniable that it continues to compound centuries after you are gone."
                }
            }
        ];

        let currentQ = 0;
        let totalScore = 0;
        
        const contentArea = document.getElementById('content-area');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        function startAssessment() {
            progressContainer.classList.remove('hidden');
            fadeTransition(() => renderQuestion(0));
        }

        function renderQuestion(index) {
            const qData = questions[index];
            progressBar.style.width = `${((index) / questions.length) * 100}%`;
            
            let optionsHtml = '';
            qData.options.forEach((opt, i) => {
                optionsHtml += `
                    <button onclick="selectOption(${opt.score})" class="w-full text-left p-5 md:p-6 rounded-xl border border-white/10 bg-white/5 hover:bg-visceral-scarlett/10 hover:border-visceral-scarlett/50 transition-all duration-300 group">
                        <div class="flex items-start gap-4">
                            <div class="w-6 h-6 rounded-full border border-gray-600 group-hover:border-visceral-scarlett flex-shrink-0 mt-0.5 flex items-center justify-center">
                                <div class="w-2 h-2 bg-visceral-scarlett rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            </div>
                            <span class="text-gray-300 group-hover:text-white font-light text-sm md:text-base leading-relaxed">${opt.text}</span>
                        </div>
                    </button>
                `;
            });

            contentArea.innerHTML = `
                <span class="text-gray-500 font-mono text-[10px] tracking-[0.3em] uppercase block mb-4">Parameter ${String(index + 1).padStart(2, '0')} // ${questions.length}</span>
                <h2 class="text-xl md:text-3xl font-cinzel text-white mb-10 leading-tight">${qData.q}</h2>
                <div class="space-y-4 w-full max-w-2xl mx-auto flex flex-col">
                    ${optionsHtml}
                </div>
            `;
        }

        function selectOption(score) {
            totalScore += score;
            fadeTransition(() => renderIntegration());
        }

        function renderIntegration() {
            const qData = questions[currentQ];
            contentArea.innerHTML = `
                <span class="text-visceral-scarlett font-mono text-[10px] tracking-[0.3em] uppercase block mb-4">Integration Synthesis // Node ${String(currentQ + 1).padStart(2, '0')}</span>
                <h2 class="text-2xl md:text-4xl font-cinzel text-white mb-10 leading-tight">${qData.theme}</h2>
                <div class="space-y-4 w-full max-w-3xl mx-auto flex flex-col mb-10 text-left">
                    <div class="p-5 md:p-6 bg-black/40 border-l-2 border-gray-600 rounded-r-xl">
                        <h4 class="text-gray-400 font-mono text-[10px] tracking-widest uppercase mb-2">I. The Anchor (Force)</h4>
                        <p class="text-sm font-light text-gray-300 leading-relaxed">${qData.insight.anchor}</p>
                    </div>
                    <div class="p-5 md:p-6 bg-black/40 border-l-2 border-white rounded-r-xl">
                        <h4 class="text-white font-mono text-[10px] tracking-widest uppercase mb-2">II. The Ascent (Logic)</h4>
                        <p class="text-sm font-light text-gray-200 leading-relaxed">${qData.insight.ascent}</p>
                    </div>
                    <div class="p-5 md:p-6 bg-black/40 border-l-2 border-visceral-scarlett rounded-r-xl shadow-[inset_0_0_20px_rgba(225,29,72,0.05)]">
                        <h4 class="text-visceral-scarlett font-mono text-[10px] tracking-widest uppercase mb-2">III. Visceral Balance</h4>
                        <p class="text-sm font-medium text-white leading-relaxed">${qData.insight.balance}</p>
                    </div>
                </div>
                <button onclick="proceedToNext()" class="btn-gold mx-auto px-10 py-4 bg-white text-black rounded-sm hover:bg-visceral-scarlett hover:text-white transition duration-300 font-bold uppercase tracking-[0.2em] text-xs shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                    Acknowledge & Proceed
                </button>
            `;
        }

        function proceedToNext() {
            currentQ++;
            
            if (currentQ < questions.length) {
                fadeTransition(() => renderQuestion(currentQ));
            } else {
                progressBar.style.width = '100%';
                fadeTransition(renderCalculation);
            }
        }

        function renderCalculation() {
            contentArea.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="w-16 h-16 border-t-2 border-r-2 border-visceral-scarlett rounded-full animate-[spin_1s_linear_infinite] mb-8"></div>
                    <h2 class="text-2xl font-cinzel text-white mb-4 uppercase tracking-widest">Integrating Phase Shift</h2>
                    <div class="text-gray-400 font-mono text-[10px] md:text-xs uppercase tracking-[0.3em] space-y-4">
                        <p class="animate-pulse">Mapping Kinetic Potential ($\\nu$)...</p>
                        <p class="animate-pulse" style="animation-delay: 0.5s;">Calculating: $$S = \\lim_{t \\to \\infty} \\sum_{n=1}^{\\infty} \\frac{P \\cdot C}{\\phi^n}$$</p>
                    </div>
                </div>
            `;
            
            // Trigger MathJax to render the injected equations cinematically
            if(window.MathJax) {
                MathJax.typesetPromise([contentArea]);
            }
            
            setTimeout(() => fadeTransition(renderResult), 3500);
        }

        function renderResult() {
            const averageScore = Math.round(totalScore / questions.length);
            let resultText, accentColor, frequency, status, directive;

            if (averageScore >= 450) {
                accentColor = "text-[#00e5ff]";
                status = "Zero Point Equilibrium";
                frequency = "528 Hz";
                resultText = "You are operating at absolute capacity. You view chaos as raw material and are mathematically prepared to integrate the full 81-Node architecture. Your Area of Impact (A) scales infinitely.";
                directive = "Execute The Matrix.";
            } else if (averageScore >= 250) {
                accentColor = "text-[#D4AF37]";
                status = "Kinetic Instability";
                frequency = "417 Hz";
                resultText = "You possess strong intellectual composure, but you are still relying on force rather than visceral intuition. You are burning excess energy managing friction ($\\phi$). It is time to bridge the gap.";
                directive = "Consult the Oracle to refine your coordinate.";
            } else {
                accentColor = "text-visceral-scarlett";
                status = "Severe Systemic Friction";
                frequency = "200 Hz";
                resultText = "You are currently experiencing massive systemic friction. The old paradigm is forcing you into a corner, draining your kinetic presence. You require immediate multidimensional alignment to halt the energy bleed.";
                directive = "Begin Phase I Alignment.";
            }

            contentArea.innerHTML = `
                <span class="${accentColor} font-mono text-[10px] md:text-xs tracking-[0.3em] uppercase block mb-4">Diagnostic Complete // ${status}</span>
                <h2 class="text-5xl md:text-7xl font-cinzel font-bold text-white mb-2">${frequency}</h2>
                <p class="text-gray-400 font-mono text-[10px] uppercase tracking-widest mb-10 border-b border-white/10 pb-6 inline-block">Operating Frequency Detected</p>
                
                <p class="text-gray-300 font-light leading-relaxed mb-8 max-w-xl mx-auto text-sm md:text-base">${resultText}</p>
                
                <div class="bg-black/30 border border-white/5 p-4 rounded-lg mb-10 max-w-md mx-auto">
                    <span class="block text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-2">Codex Directive</span>
                    <span class="text-sm font-bold text-white tracking-wider">${directive}</span>
                </div>
                
                <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
                    <a href="matrix81.html" class="w-full sm:w-auto px-10 py-4 bg-white text-black rounded-sm hover:bg-gray-200 transition duration-300 font-bold uppercase tracking-[0.2em] text-xs shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                        Align The 81 Nodes
                    </a>
                </div>
            `;
        }

        function fadeTransition(callback) {
            contentArea.style.opacity = '0';
            setTimeout(() => {
                callback();
                // Re-trigger MathJax just in case equations are in the new view
                if(window.MathJax) {
                    MathJax.typesetPromise([contentArea]);
                }
                contentArea.style.opacity = '1';
            }, 500);
        }
    </script>
    
    <!-- Link Global Script for Cursor & Effects -->
    <script src="script.js"></script>
</body>
</html>
